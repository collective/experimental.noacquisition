name: CI
on:
  push:
    branches: ["main", "master"]
  pull_request:
  # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Don't hide the other legs when one fails.
      fail-fast: false
      matrix:
        config:
        # [Python version, tox env]
        # py27 and py37 are commented out here (they still work with
        # tox locally): actions/setup-python can no longer install them
        # on the ubuntu-24.04 runner image, both are EOL and
        # unavailable/unsupported there.
        # - ["2.7",  "py27-plone52"]
        # - ["3.7",  "py37-plone52"]
        # - ["3.8",  "py38-plone52"]
        # py38-plone60 is commented out: Plone 6.0's current constraints
        # pin plone.recipe.zope2instance >= 8.0.0, which requires
        # Python >= 3.9. Still in tox.ini for local use with older pins.
        # - ["3.8",  "py38-plone60"]
        - ["3.9",  "py39-plone60"]
        - ["3.10",  "py310-plone60"]
        - ["3.11",  "py311-plone60"]
        - ["3.10",  "py310-plone61"]
        - ["3.11",  "py311-plone61"]
        - ["3.12",  "py312-plone61"]
        - ["3.13",  "py313-plone61"]
        - ["3.10",  "py310-plone62"]
        - ["3.11",  "py311-plone62"]
        - ["3.12",  "py312-plone62"]
        - ["3.13",  "py313-plone62"]
    name: ${{ matrix.config[1] }}
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.config[0] }}
    - name: Pip cache
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.config[0] }}-${{ hashFiles('setup.*', 'tox.ini') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.config[0] }}-
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox
    - name: Test
      run: tox -e ${{ matrix.config[1] }}
    - name: Workaround (https://github.com/actions/runner-images/issues/6775)
      run: git config --global --add safe.directory '*'
    - name: Coveralls
      uses: AndreMiras/coveralls-python-action@v20201129
      with:
        parallel: true
        flag-name: ${{ matrix.config[1] }}

  coveralls_finish:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Workaround (https://github.com/actions/runner-images/issues/6775)
      run: git config --global --add safe.directory '*'
    - name: Coveralls Finished
      uses: AndreMiras/coveralls-python-action@v20201129
      with:
        parallel-finished: true
